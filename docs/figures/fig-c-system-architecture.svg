<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img"><title>Flood monitor architecture and data flow</title><desc>A sensor node sends readings by WiFi MQTT or nRF24 radio to the Raspberry Pi. The Pi runs Mosquitto and Node-RED, drives the local buzzer, LED and LCD alarm, and bridges readings and alerts to the Proxmox container. The container runs Mosquitto, Node-RED, InfluxDB and Grafana and keeps the history and the dashboard. The officer sees the dashboard and hears the Pi alarm.</desc>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;fill:#2C2C2A}
.th{font-size:14px;font-weight:500}.ts{font-size:12px;fill:#5F5E5A}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.box rect{fill:#FFFFFF;stroke:#888780}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-green rect{fill:#EAF3DE;stroke:#3B6D11}.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="640" fill="#FFFFFF"/>
<g class="c-gray"><rect x="45" y="30" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185.0" y="50" text-anchor="middle" dominant-baseline="central">Sensor node</text><text class="ts" x="185.0" y="68" text-anchor="middle" dominant-baseline="central">ESP32, HC-SR04, temperature</text></g>
<rect x="30" y="150" width="310" height="300" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="45" y="436" text-anchor="start" dominant-baseline="central">Raspberry Pi: edge</text>
<rect x="360" y="150" width="300" height="300" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="375" y="436" text-anchor="start" dominant-baseline="central">Proxmox container: historian</text>
<line x1="115" y1="88" x2="115" y2="168" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="107" y="128" text-anchor="end" dominant-baseline="central">WiFi, MQTT</text>
<line x1="255" y1="88" x2="255" y2="168" class="arr dash" marker-end="url(#arrow)"/>
<text class="ts" x="263" y="128" text-anchor="start" dominant-baseline="central">nRF24 radio</text>
<g class="c-gray"><rect x="50" y="170" width="270" height="50" rx="8" stroke-width="0.5"/><text class="th" x="185.0" y="188" text-anchor="middle" dominant-baseline="central">Mosquitto</text><text class="ts" x="185.0" y="206" text-anchor="middle" dominant-baseline="central">local broker, readings arrive</text></g>
<g class="c-teal"><rect x="50" y="250" width="270" height="50" rx="8" stroke-width="0.5"/><text class="th" x="185.0" y="268" text-anchor="middle" dominant-baseline="central">Node-RED (edge)</text><text class="ts" x="185.0" y="286" text-anchor="middle" dominant-baseline="central">filter, decide, notify</text></g>
<g class="c-gray"><rect x="50" y="330" width="270" height="50" rx="8" stroke-width="0.5"/><text class="th" x="185.0" y="348" text-anchor="middle" dominant-baseline="central">Buzzer, LED, LCD, button</text><text class="ts" x="185.0" y="366" text-anchor="middle" dominant-baseline="central">local alarm and acknowledge</text></g>
<line x1="185" y1="222" x2="185" y2="248" class="arr" marker-end="url(#arrow)"/>
<line x1="185" y1="302" x2="185" y2="328" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="375" y="170" width="260" height="44" rx="8" stroke-width="0.5"/><text class="th" x="505.0" y="186" text-anchor="middle" dominant-baseline="central">Mosquitto</text><text class="ts" x="505.0" y="202" text-anchor="middle" dominant-baseline="central">bridged readings, alerts</text></g>
<g class="c-teal"><rect x="375" y="236" width="260" height="44" rx="8" stroke-width="0.5"/><text class="th" x="505.0" y="252" text-anchor="middle" dominant-baseline="central">Node-RED</text><text class="ts" x="505.0" y="268" text-anchor="middle" dominant-baseline="central">same logic, fallback alert</text></g>
<g class="c-purple"><rect x="375" y="302" width="260" height="44" rx="8" stroke-width="0.5"/><text class="th" x="505.0" y="318" text-anchor="middle" dominant-baseline="central">InfluxDB</text><text class="ts" x="505.0" y="334" text-anchor="middle" dominant-baseline="central">stores every reading</text></g>
<g class="c-coral"><rect x="375" y="368" width="260" height="44" rx="8" stroke-width="0.5"/><text class="th" x="505.0" y="384" text-anchor="middle" dominant-baseline="central">Grafana</text><text class="ts" x="505.0" y="400" text-anchor="middle" dominant-baseline="central">dashboard for officers</text></g>
<line x1="505" y1="216" x2="505" y2="234" class="arr" marker-end="url(#arrow)"/>
<line x1="505" y1="282" x2="505" y2="300" class="arr" marker-end="url(#arrow)"/>
<line x1="505" y1="348" x2="505" y2="366" class="arr" marker-end="url(#arrow)"/>
<line x1="322" y1="192" x2="373" y2="192" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="347" y="181" text-anchor="middle" dominant-baseline="central">bridge</text>
<line x1="322" y1="262" x2="373" y2="262" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="347" y="251" text-anchor="middle" dominant-baseline="central">alerts</text>
<g class="c-gray"><rect x="240" y="500" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340.0" y="520" text-anchor="middle" dominant-baseline="central">Officer</text><text class="ts" x="340.0" y="538" text-anchor="middle" dominant-baseline="central">sees dashboard, hears buzzer</text></g>
<path d="M185 382 L185 528 L238 528" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="177" y="500" text-anchor="end" dominant-baseline="central">local alarm</text>
<path d="M635 390 L648 390 L648 528 L442 528" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="456" y="548" text-anchor="start" dominant-baseline="central">dashboard, alert history</text>
<line x1="40" y1="600" x2="72" y2="600" class="arr"/>
<text class="ts" x="80" y="600" text-anchor="start" dominant-baseline="central">normal path</text>
<line x1="200" y1="600" x2="232" y2="600" class="arr dash"/>
<text class="ts" x="240" y="600" text-anchor="start" dominant-baseline="central">radio fallback (WiFi down)</text>
</svg>
