<svg xmlns="http://www.w3.org/2000/svg" width="680" height="504" viewBox="0 0 680 504" role="img"><title>Path of one sensor reading</title><desc>A raw reading goes from the sensor to the Mosquitto broker, then Node-RED cleans it, InfluxDB stores it, and Grafana displays it.</desc>
<style>
text{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;fill:#2C2C2A}
.th{font-size:14px;font-weight:500}.ts{font-size:12px;fill:#5F5E5A}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.box rect{fill:#FFFFFF;stroke:#888780}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-green rect{fill:#EAF3DE;stroke:#3B6D11}.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="504" fill="#FFFFFF"/>
<g class="c-gray"><rect x="40" y="40" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="165.0" y="60" text-anchor="middle" dominant-baseline="central">Sensor or simulator</text><text class="ts" x="165.0" y="78" text-anchor="middle" dominant-baseline="central">measures, sends JSON</text></g>
<g class="box"><rect x="390" y="40" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="515.0" y="60" text-anchor="middle" dominant-baseline="central">Raw reading</text><text class="ts" x="515.0" y="78" text-anchor="middle" dominant-baseline="central">distance, temperature, seq</text></g>
<line x1="292" y1="68" x2="388" y2="68" class="arr" marker-end="url(#arrow)"/>
<line x1="165" y1="98" x2="165" y2="130" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="132" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="165.0" y="152" text-anchor="middle" dominant-baseline="central">Mosquitto broker</text><text class="ts" x="165.0" y="170" text-anchor="middle" dominant-baseline="central">checks login, routes by topic</text></g>
<g class="box"><rect x="390" y="132" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="515.0" y="152" text-anchor="middle" dominant-baseline="central">Same message</text><text class="ts" x="515.0" y="170" text-anchor="middle" dominant-baseline="central">only if login is valid</text></g>
<line x1="292" y1="160" x2="388" y2="160" class="arr" marker-end="url(#arrow)"/>
<line x1="165" y1="190" x2="165" y2="222" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="224" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="165.0" y="244" text-anchor="middle" dominant-baseline="central">Node-RED</text><text class="ts" x="165.0" y="262" text-anchor="middle" dominant-baseline="central">cleans, corrects, converts</text></g>
<g class="box"><rect x="390" y="224" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="515.0" y="244" text-anchor="middle" dominant-baseline="central">Clean values</text><text class="ts" x="515.0" y="262" text-anchor="middle" dominant-baseline="central">level, rate, quality, verdict</text></g>
<line x1="292" y1="252" x2="388" y2="252" class="arr" marker-end="url(#arrow)"/>
<line x1="165" y1="282" x2="165" y2="314" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="316" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="165.0" y="336" text-anchor="middle" dominant-baseline="central">InfluxDB</text><text class="ts" x="165.0" y="354" text-anchor="middle" dominant-baseline="central">stores every reading</text></g>
<g class="box"><rect x="390" y="316" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="515.0" y="336" text-anchor="middle" dominant-baseline="central">One stored row</text><text class="ts" x="515.0" y="354" text-anchor="middle" dominant-baseline="central">raw and clean, 30 days</text></g>
<line x1="292" y1="344" x2="388" y2="344" class="arr" marker-end="url(#arrow)"/>
<line x1="165" y1="374" x2="165" y2="406" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="40" y="408" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="165.0" y="428" text-anchor="middle" dominant-baseline="central">Grafana</text><text class="ts" x="165.0" y="446" text-anchor="middle" dominant-baseline="central">draws it, decides nothing</text></g>
<g class="box"><rect x="390" y="408" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="515.0" y="428" text-anchor="middle" dominant-baseline="central">Dashboard</text><text class="ts" x="515.0" y="446" text-anchor="middle" dominant-baseline="central">tiles, charts, reject counts</text></g>
<line x1="292" y1="436" x2="388" y2="436" class="arr" marker-end="url(#arrow)"/>
</svg>
